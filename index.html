<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Perceptron 2026 — Group Standings</title>

<style>
body{
  margin:0;
  padding:32px;
  background:#020617;
  color:#e5e7eb;
  font-family:Poppins,system-ui,Arial;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:36px;
  background:linear-gradient(90deg,#7dd3fc,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
  gap:26px;
}

.card{
  background:#0f172a;
  border-radius:20px;
  padding:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.65);
}

.card h2{
  text-align:center;
  color:#7dd3fc;
  margin-bottom:12px;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 6px;
  font-size:14px;
}

th,td{
  padding:8px 6px;
  text-align:center;
}

th{
  background:#1e293b;
  border-radius:8px;
  font-weight:600;
}

tr{
  background:rgba(255,255,255,.03);
  border-radius:10px;
}

tr.top2{
  color:#4ade80;
  font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(74,222,128,.45);
}
</style>
</head>

<body>

<h1>Perceptron 2026 — Group Standings</h1>

<div class="grid" id="groups"></div>

<script>
const SHEET_ID = "1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

const GROUPS = [
  "Group 1","Group 2","Group 3","Group 4",
  "Group 5","Group 6","Group 7","Group 8"
];

async function loadGroup(name){
  const range = "J2:R50"; // wide & safe
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
    `sheet=${encodeURIComponent(name)}&range=${range}&tq=select%20*`;

  const res = await fetch(url);
  const txt = await res.text();
  const json = JSON.parse(txt.substring(47).slice(0,-2));

  // DO NOT FILTER ROWS
  return json.table.rows.map(r =>
    r.c.map(c => c?.v ?? "")
  );
}

async function render(){
  const root = document.getElementById("groups");
  root.innerHTML = "";

  for(const group of GROUPS){
    const rows = await loadGroup(group);

    // keep only rows with player name
    const clean = rows.filter(r => r[0] !== "");

    const card = document.createElement("div");
    card.className = "card";

    let html = `
      <h2>${group}</h2>
      <table>
        <tr>
          <th>Player</th><th>P</th><th>W</th><th>L</th><th>D</th>
          <th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
        </tr>`;

    clean.forEach((r,i)=>{
      html += `
        <tr class="${i<2 ? "top2" : ""}">
          <td>${r[0]}</td>
          <td>${r[1]}</td>
          <td>${r[2]}</td>
          <td>${r[3]}</td>
          <td>${r[4]}</td>
          <td>${r[5]}</td>
          <td>${r[6]}</td>
          <td>${r[7]}</td>
          <td>${r[8]}</td>
        </tr>`;
    });

    html += "</table>";
    card.innerHTML = html;
    root.appendChild(card);
  }
}

render();
setInterval(render, 30000);
</script>

</body>
</html>

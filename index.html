<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Perceptron 2026 — eFootball Group Standings</title>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --header:#1e293b;
  --accent:#7dd3fc;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  margin:0;
  padding:32px;
  background:
    radial-gradient(circle at 50% 10%, rgba(59,130,246,.25), transparent 45%),
    radial-gradient(circle at 15% 70%, rgba(14,165,233,.15), transparent 40%),
    radial-gradient(circle at 85% 70%, rgba(14,165,233,.15), transparent 40%),
    linear-gradient(180deg,#020617,#020617);
  color:var(--text);
  font-family:Poppins,system-ui,Arial;
}

h1{
  text-align:center;
  margin-bottom:36px;
  font-size:40px;
  background:linear-gradient(90deg,#7dd3fc,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
  gap:22px;
}

.card{
  background:
    radial-gradient(circle at top, rgba(255,255,255,.06), transparent 70%),
    linear-gradient(180deg,#0f172a,#020617);
  border-radius:20px;
  padding:16px 18px;
  box-shadow:
    0 20px 45px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.05);
}

.card h2{
  margin:0 0 12px;
  font-size:20px;
  color:var(--accent);
  text-align:center;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 7px;
  font-size:14px;
}

th{
  background:var(--header);
  padding:8px;
  border-radius:8px;
  font-weight:600;
}

td{
  padding:8px;
  text-align:center;
  background:rgba(255,255,255,.035);
  border-radius:8px;
}

tbody tr.top2 td{
  color:var(--win);
  font-weight:700;
  box-shadow:
    inset 0 0 0 1px rgba(74,222,128,.45),
    0 0 12px rgba(74,222,128,.35);
}

.badge{
  margin-left:6px;
  font-size:11px;
  padding:2px 6px;
  border-radius:6px;
  background:rgba(74,222,128,.15);
  color:var(--win);
  font-weight:600;
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Group Standings</h1>

<div id="groups" class="grid"></div>

<script>
const SHEET_ID = "1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";
const GROUPS = [
  "Group 1","Group 2","Group 3","Group 4",
  "Group 5","Group 6","Group 7","Group 8"
];

async function loadGroup(name){
  const range = "T2:AB12";
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(name)}&range=${range}&tq=select%20*`;

  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(47, text.length - 2));

  return json.table.rows
    .map(r => r.c.map(c => c ? c.v : null))
    .filter(r => r[0] !== "");
}

async function render(){
  const container = document.getElementById("groups");
  container.innerHTML = "";

  for(const name of GROUPS){
    const rows = await loadGroup(name);
    const card = document.createElement("div");
    card.className = "card";

    let html = `
      <h2>${name}</h2>
      <table>
        <thead>
          <tr>
            <th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th>
            <th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach((r,i)=>{
      const cls = i < 2 ? "top2" : "";
      const badge = i < 2 ? `<span class="badge">QUALIFIED</span>` : "";
      html += `
        <tr class="${cls}">
          <td>${r[0]}${badge}</td>
          ${r.slice(1).map(v => `<td>${v ?? ""}</td>`).join("")}
        </tr>`;
    });

    html += "</tbody></table>";
    card.innerHTML = html;
    container.appendChild(card);
  }
}

render();
setInterval(render,25000);
</script>

</body>
</html>

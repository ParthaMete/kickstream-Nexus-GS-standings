<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>eFootball Knockout Stage</title>

<style>
:root{
  --accent:#22d3ee;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  background:
    radial-gradient(circle at top,#1e293b,#020617 55%),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.02) 0px,
      rgba(255,255,255,.02) 2px,
      transparent 2px,
      transparent 6px
    );
  color:var(--text);
  font-family:Poppins,system-ui,Arial;
  padding:30px;
}

h1{
  text-align:center;
  font-size:36px;
  margin-bottom:14px;
  background:linear-gradient(90deg,#22d3ee,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

a{
  color:#7dd3fc;
  text-decoration:none;
}

/* BRACKET GRID */
.bracket{
  display:grid;
  grid-template-columns: 1.2fr 1fr 1.2fr 1fr 1.2fr;
  gap:28px;
  align-items:center;
}

/* COLUMNS */
.column{
  display:flex;
  flex-direction:column;
  gap:14px;
  background:rgba(15,23,42,.6);
  backdrop-filter: blur(10px);
  border-radius:18px;
  padding:14px;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.column.center{
  align-items:center;
}

/* TITLES */
.column h2{
  text-align:center;
  margin-bottom:10px;
  color:#7dd3fc;
}

/* MATCH CARD */
.match{
  background:rgba(255,255,255,.05);
  border-radius:14px;
  padding:12px;
  text-align:center;
  transition:.3s;
}

.match:hover{
  transform:scale(1.03);
}

.player{
  padding:6px 0;
  font-size:15px;
}

.score{
  font-size:20px;
  font-weight:700;
  margin:6px 0;
}

.win{
  color:var(--win);
  font-weight:700;
  text-shadow:0 0 10px rgba(74,222,128,.8);
}

/* TROPHY */
.trophy{
  font-size:90px;
  margin:20px 0;
  filter: drop-shadow(0 0 25px rgba(34,211,238,.8));
}

/* BIG SCREEN */
@media (min-width:1400px){
  body{padding:50px;}
  h1{font-size:44px;}
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<p style="text-align:center;">
  <a href="index.html">← Back to Group Stage</a>
</p>

<div id="bracket" class="bracket"></div>

<script>
const SHEET_ID = "1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(sheet){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(47).slice(0,-2));
  return json.table.rows.map(r => r.c.map(c => c?.v ?? ""));
}

function matchCard([,a,b,sa,sb]){
  let aWin="", bWin="";
  if(sa!=="" && sb!==""){
    if(sa>sb) aWin="win";
    if(sb>sa) bWin="win";
  }
  return `
    <div class="match">
      <div class="player ${aWin}">${a}</div>
      <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
      <div class="player ${bWin}">${b}</div>
    </div>
  `;
}

async function render(){
  const root = document.getElementById("bracket");
  root.innerHTML = "";

  const r16 = await fetchSheet("Knockout");
  const qf  = await fetchSheet("Quarterfinals");
  const sf  = await fetchSheet("Semifinals");
  const fin = await fetchSheet("Final");
  const third = await fetchSheet("ThirdPlace");

  const col = (title, rows, center=false) => {
    const d = document.createElement("div");
    d.className = center ? "column center" : "column";
    d.innerHTML = `<h2>${title}</h2>`;
    rows.forEach(r => d.innerHTML += matchCard(r));
    return d;
  };

  const center = col("Final", fin, true);
  center.innerHTML += `<div class="trophy">🏆</div>`;
  center.innerHTML += `<h2>3rd Place Match</h2>`;
  third.forEach(r => center.innerHTML += matchCard(r));

  root.append(
    col("Round of 16", r16.slice(0,4)),
    col("Quarterfinals", qf.slice(0,2)),
    center,
    col("Quarterfinals", qf.slice(2)),
    col("Round of 16", r16.slice(4))
  );
}

render();
setInterval(render, 20000);
</script>

</body>
</html>

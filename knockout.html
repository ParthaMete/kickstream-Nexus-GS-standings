<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perceptron 2026 — eFootball Knockouts</title>

<style>
:root{
  --bg:#020617;
  --panel:#0b1224;
  --card:#111827;
  --line:#38bdf8;
  --win:#4ade80;
  --text:#e5e7eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:50px;
  font-family:Poppins,system-ui,Arial;
  color:var(--text);

  background:
    radial-gradient(circle at top,#1e293b,#020617 70%),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 1px,
      transparent 8px
    ),
    linear-gradient(
      to bottom,
      rgba(255,255,255,.04),
      transparent 30%,
      rgba(0,0,0,.8)
    );
}

/* Stadium light beams */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(120deg,transparent,rgba(56,189,248,.08),transparent),
    linear-gradient(-120deg,transparent,rgba(56,189,248,.06),transparent);
  animation:lights 8s infinite alternate;
  pointer-events:none;
}

@keyframes lights{
  from{opacity:.3}
  to{opacity:.7}
}

h1{
  text-align:center;
  font-size:52px;
  margin-bottom:8px;
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:40px;
}

a{color:#7dd3fc;text-decoration:none}

/* ================= BRACKET ================= */

.bracket{
  position:relative;
  display:grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr 1.4fr;
  gap:80px;
  align-items:center;
}

/* ================= COLUMNS ================= */

.column{
  display:flex;
  flex-direction:column;
  gap:26px;
  position:relative;
}

.column h2{
  text-align:center;
  color:#7dd3fc;
  letter-spacing:1px;
}

.center{
  align-items:center;
}

/* ================= MATCH CARD ================= */

.match{
  background:linear-gradient(180deg,#111827,#0b1224);
  border-radius:18px;
  padding:16px;
  text-align:center;
  box-shadow:0 20px 45px rgba(0,0,0,.55);
  transition:.35s ease;
}

.match:hover{
  transform:translateY(-6px) scale(1.05);
}

.match.locked{
  opacity:.35;
  filter:grayscale(1);
}

.player{
  font-size:15px;
  padding:6px 0;
}

.score{
  font-size:22px;
  font-weight:800;
  margin:6px 0;
}

.win{
  color:var(--win);
  text-shadow:0 0 18px rgba(74,222,128,.9);
}

/* ================= CONNECTOR LINES ================= */

.line-h{
  position:absolute;
  height:3px;
  background:linear-gradient(to right,transparent,var(--line),transparent);
  opacity:.7;
}

.line-v{
  position:absolute;
  width:3px;
  background:linear-gradient(to bottom,transparent,var(--line),transparent);
  opacity:.7;
}

/* ================= FINAL ================= */

.champion{
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  color:#020617;
  padding:14px 36px;
  border-radius:999px;
  font-weight:800;
  margin-bottom:18px;
  animation:champ 2.5s infinite;
}

@keyframes champ{
  0%{box-shadow:0 0 15px rgba(56,189,248,.4)}
  50%{box-shadow:0 0 45px rgba(56,189,248,1)}
  100%{box-shadow:0 0 15px rgba(56,189,248,.4)}
}

.trophy{
  font-size:120px;
  margin:20px 0;
  filter:drop-shadow(0 0 35px rgba(56,189,248,.9));
}

/* ================= RESPONSIVE ================= */

@media (min-width:1600px){
  body{padding:70px}
  h1{font-size:64px}
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="sub"><a href="index.html">← Back to Group Stage</a></div>

<div id="bracket" class="bracket"></div>

<script>
const SHEET_ID="1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  const t=await r.text();
  const j=JSON.parse(t.substring(47).slice(0,-2));
  return j.table.rows.map(x=>x.c.map(c=>c?.v ?? ""));
}

function card([,a,b,sa,sb]){
  let aw="",bw="",lock="locked";
  if(sa!==""&&sb!==""){
    lock="";
    if(sa>sb) aw="win";
    if(sb>sa) bw="win";
  }
  return `
    <div class="match ${lock}">
      <div class="player ${aw}">${a}</div>
      <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
      <div class="player ${bw}">${b}</div>
    </div>`;
}

async function render(){
  const r16=await fetchSheet("Knockout");
  const qf =await fetchSheet("Quarterfinals");
  const sf =await fetchSheet("Semifinals");
  const fin=await fetchSheet("Final");
  const third=await fetchSheet("ThirdPlace");

  const col=(title,rows)=>{
    const d=document.createElement("div");
    d.className="column";
    d.innerHTML=`<h2>${title}</h2>`;
    rows.forEach(r=>d.innerHTML+=card(r));
    return d;
  };

  const center=document.createElement("div");
  center.className="column center";
  center.innerHTML="<h2>Final</h2>";
  fin.forEach(r=>center.innerHTML+=card(r));

  if(fin[0]&&fin[0][3]!==""&&fin[0][4]!==""){
    const w=fin[0][3]>fin[0][4]?fin[0][1]:fin[0][2];
    center.innerHTML=`<div class="champion">🏆 Champion: ${w}</div>`+center.innerHTML;
  }

  center.innerHTML+=`<div class="trophy">🏆</div><h2>3rd Place Match</h2>`;
  third.forEach(r=>center.innerHTML+=card(r));

  const root=document.getElementById("bracket");
  root.innerHTML="";
  root.append(
    col("Round of 16",r16.slice(0,4)),
    col("Quarterfinals",qf.slice(0,2)),
    center,
    col("Quarterfinals",qf.slice(2)),
    col("Round of 16",r16.slice(4))
  );
}

render();
setInterval(render,20000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perceptron 2026 — eFootball Knockouts</title>

<style>
:root{
  --bg:#020617;
  --card:#0b1226;
  --line:#38bdf8;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  margin:0;
  padding:60px;
  font-family:Poppins,system-ui,Arial;
  color:var(--text);

  background:
    radial-gradient(circle at center, rgba(56,189,248,.18), transparent 55%),
    radial-gradient(circle at bottom, rgba(0,0,0,.9), transparent 60%),
    linear-gradient(#020617,#020617);
}

/* TITLE */
h1{
  text-align:center;
  font-size:52px;
  margin-bottom:10px;
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:50px;
}

/* BRACKET GRID */
.bracket{
  display:grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr 1.4fr;
  gap:70px;
  align-items:center;
}

/* COLUMN */
.column{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.column h2{
  text-align:center;
  color:#7dd3fc;
}

/* MATCH CARD */
.match{
  position:relative;
  background:linear-gradient(180deg,#0f172a,#020617);
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.8);
}

/* CONNECTOR LINE */
.match::after{
  content:"";
  position:absolute;
  right:-35px;
  top:50%;
  width:35px;
  height:2px;
  background:var(--line);
}
.right .match::after{
  left:-35px;
  right:auto;
}

/* TEXT */
.player{padding:6px 0}
.score{font-size:22px;font-weight:800}
.win{color:var(--win)}

/* CENTER */
.center{
  align-items:center;
}
.trophy{
  font-size:120px;
  margin:25px 0;
  filter:drop-shadow(0 0 40px rgba(56,189,248,.9));
}
.champion{
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  color:#020617;
  padding:14px 36px;
  border-radius:999px;
  font-weight:800;
  margin-bottom:20px;
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="sub">🏆 Road to Glory</div>

<div class="bracket" id="bracket"></div>

<script>
const SHEET_ID="1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  const t=await r.text();
  const j=JSON.parse(t.substring(47).slice(0,-2));
  return j.table.rows.map(x=>x.c.map(c=>c?.v ?? ""));
}

function card([,a,b,sa,sb]){
  let aw="",bw="";
  if(sa!==""&&sb!==""){
    if(sa>sb) aw="win";
    if(sb>sa) bw="win";
  }
  return `
  <div class="match">
    <div class="player ${aw}">${a}</div>
    <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
    <div class="player ${bw}">${b}</div>
  </div>`;
}

async function render(){
  const r16=await fetchSheet("Knockout");
  const qf =await fetchSheet("Quarterfinals");
  const fin=await fetchSheet("Final");
  const third=await fetchSheet("ThirdPlace");

  const col=(title,rows,cls="")=>{
    const d=document.createElement("div");
    d.className=`column ${cls}`;
    d.innerHTML=`<h2>${title}</h2>`;
    rows.forEach(r=>d.innerHTML+=card(r));
    return d;
  };

  const center=document.createElement("div");
  center.className="column center";
  center.innerHTML="<h2>Final</h2>";
  fin.forEach(r=>center.innerHTML+=card(r));

  if(fin[0]&&fin[0][3]!==""&&fin[0][4]!==""){
    const w=fin[0][3]>fin[0][4]?fin[0][1]:fin[0][2];
    center.innerHTML=`<div class="champion">🏆 Champion: ${w}</div>`+center.innerHTML;
  }

  center.innerHTML+=`<div class="trophy">🏆</div>
    <h2>3rd Place</h2>`;
  third.forEach(r=>center.innerHTML+=card(r));

  const root=document.getElementById("bracket");
  root.innerHTML="";
  root.append(
    col("Round of 16",r16.slice(0,4)),
    col("Quarterfinals",qf.slice(0,2)),
    center,
    col("Quarterfinals",qf.slice(2),"right"),
    col("Round of 16",r16.slice(4),"right")
  );
}

render();
setInterval(render,20000);
</script>

</body>
</html>

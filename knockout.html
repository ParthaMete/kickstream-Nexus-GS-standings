<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Perceptron 2026 — eFootball Knockouts</title>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --divider:#1e40af;
  --accent:#7dd3fc;
  --win:#4ade80;
  --text:#e5e7eb;
}

/* ===== PAGE ===== */
body{
  margin:0;
  padding:32px 20px;
  font-family:Poppins,system-ui,Arial;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 10%, rgba(59,130,246,.25), transparent 45%),
    radial-gradient(circle at 15% 70%, rgba(14,165,233,.15), transparent 40%),
    radial-gradient(circle at 85% 70%, rgba(14,165,233,.15), transparent 40%),
    linear-gradient(180deg,#020617,#020617);
  overflow-x:hidden;
}

/* ===== HEADER ===== */
h1{
  text-align:center;
  font-size:38px;
  margin-bottom:6px;
  background:linear-gradient(90deg,#7dd3fc,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:40px;
}

/* ===== BRACKET GRID ===== */
.bracket{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:
    260px 12px
    220px 12px
    200px 12px
    220px 12px
    260px;
  align-items:start;
}

/* ===== DIVIDERS ===== */
.divider{
  width:4px;
  background:linear-gradient(to bottom, transparent, var(--divider), transparent);
  border-radius:8px;
  opacity:.75;
}

/* ===== COLUMNS ===== */
.column{
  display:flex;
  flex-direction:column;
  gap:18px;
}
.column h2{
  text-align:center;
  color:var(--accent);
  font-size:18px;
  margin-bottom:4px;
}

/* ===== MATCH CARD ===== */
.match{
  background:
    radial-gradient(circle at top, rgba(255,255,255,.05), transparent 70%),
    linear-gradient(180deg,#0f172a,#020617);
  border-radius:16px;
  padding:14px;
  text-align:center;
  box-shadow:
    0 18px 40px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.05);
}

.player{padding:4px 0;font-size:14px}
.score{
  font-size:18px;
  font-weight:800;
  margin:4px 0;
}
.win{color:var(--win)}

/* ===== CENTER COLUMN ===== */
.center{
  align-items:center;
}

/* ===== TROPHY ===== */
.trophy{
  font-size:90px;
  margin:14px 0;
  position:relative;
}
.trophy::before{
  content:"";
  position:absolute;
  inset:-22px;
  background:radial-gradient(circle, rgba(250,204,21,.45), transparent 70%);
  filter:blur(18px);
  z-index:-1;
}

.section-title{
  color:var(--accent);
  margin-top:12px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="sub">Official Knockout Stage</div>

<div class="bracket" id="bracket"></div>

<script>
const SHEET_ID="1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  const t=await r.text();
  const j=JSON.parse(t.substring(47).slice(0,-2));
  return j.table.rows.map(x=>x.c.map(c=>c?.v ?? ""));
}

function card([,a,b,sa,sb]){
  let aw="",bw="";
  if(sa!==""&&sb!==""){
    if(sa>sb) aw="win";
    if(sb>sa) bw="win";
  }
  return `
    <div class="match">
      <div class="player ${aw}">${a}</div>
      <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
      <div class="player ${bw}">${b}</div>
    </div>`;
}

async function render(){
  const r16=await fetchSheet("Knockout");       // 8 matches
  const qf =await fetchSheet("Quarterfinals"); // 4 matches
  const fin=await fetchSheet("Final");          // 1 match
  const third=await fetchSheet("ThirdPlace");  // 1 match

  const col=(title,rows)=>{
    const d=document.createElement("div");
    d.className="column";
    d.innerHTML=`<h2>${title}</h2>`;
    rows.forEach(r=>d.innerHTML+=card(r));
    return d;
  };

  const center=document.createElement("div");
  center.className="column center";
  center.innerHTML=`<h2>Final</h2>`;
  fin.forEach(r=>center.innerHTML+=card(r));
  center.innerHTML+=`<div class="trophy">🏆</div>`;
  center.innerHTML+=`<div class="section-title">3rd Place</div>`;
  third.forEach(r=>center.innerHTML+=card(r));

  const root=document.getElementById("bracket");
  root.innerHTML="";
  root.append(
    col("Round of 16",r16.slice(0,4)),
    Object.assign(document.createElement("div"),{className:"divider"}),
    col("Quarterfinals",qf.slice(0,2)),
    Object.assign(document.createElement("div"),{className:"divider"}),
    center,
    Object.assign(document.createElement("div"),{className:"divider"}),
    col("Quarterfinals",qf.slice(2,4)),
    Object.assign(document.createElement("div"),{className:"divider"}),
    col("Round of 16",r16.slice(4,8))
  );
}

render();
setInterval(render,20000);
</script>

</body>
</html>

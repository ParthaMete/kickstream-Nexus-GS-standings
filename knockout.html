<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Perceptron 2026 — eFootball Knockouts</title>

<style>
:root{
  --bg:#060913;
  --card:#0f172a;
  --divider:#1e3a8a;
  --accent:#7dd3fc;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  margin:0;
  padding:50px;
  font-family:Poppins,system-ui,Arial;
  color:var(--text);
  background:
    radial-gradient(circle at center, rgba(30,58,138,.25), transparent 55%),
    linear-gradient(#060913,#020617);
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:12px;
  background:linear-gradient(90deg,#7dd3fc,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:50px;
}

/* MAIN GRID */
.bracket{
  display:grid;
  grid-template-columns:
    1.4fr  /* R16 left */
    40px
    1fr    /* QF left */
    40px
    1fr    /* FINAL */
    40px
    1fr    /* QF right */
    40px
    1.4fr; /* R16 right */
  align-items:start;
}

/* SIMPLE DIVIDER */
.divider{
  width:6px;
  height:100%;
  background:linear-gradient(
    to bottom,
    transparent,
    var(--divider),
    transparent
  );
  border-radius:10px;
}

/* COLUMN */
.column{
  display:flex;
  flex-direction:column;
  gap:26px;
}

.column h2{
  text-align:center;
  color:var(--accent);
  margin-bottom:6px;
}

/* MATCH CARD */
.match{
  background:linear-gradient(180deg,#0f172a,#020617);
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:
    0 20px 45px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.04);
}

.player{padding:6px 0}
.score{
  font-size:22px;
  font-weight:800;
  margin:6px 0;
}
.win{color:var(--win)}

/* CENTER */
.center{
  align-items:center;
}

.trophy{
  font-size:110px;
  margin:20px 0;
}
.champion{
  background:#1e40af;
  padding:12px 36px;
  border-radius:999px;
  font-weight:800;
  margin-bottom:20px;
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="sub">Official Knockout Stage</div>

<div class="bracket" id="bracket"></div>

<script>
const SHEET_ID="1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  const t=await r.text();
  const j=JSON.parse(t.substring(47).slice(0,-2));
  return j.table.rows.map(x=>x.c.map(c=>c?.v ?? ""));
}

function card([,a,b,sa,sb]){
  let aw="",bw="";
  if(sa!==""&&sb!==""){
    if(sa>sb) aw="win";
    if(sb>sa) bw="win";
  }
  return `
    <div class="match">
      <div class="player ${aw}">${a}</div>
      <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
      <div class="player ${bw}">${b}</div>
    </div>`;
}

async function render(){
  const r16=await fetchSheet("Knockout");
  const qf =await fetchSheet("Quarterfinals");
  const fin=await fetchSheet("Final");
  const third=await fetchSheet("ThirdPlace");

  const col=(title,rows)=>{
    const d=document.createElement("div");
    d.className="column";
    d.innerHTML=`<h2>${title}</h2>`;
    rows.forEach(r=>d.innerHTML+=card(r));
    return d;
  };

  const center=document.createElement("div");
  center.className="column center";
  center.innerHTML="<h2>Final</h2>";
  fin.forEach(r=>center.innerHTML+=card(r));
  center.innerHTML+=`<div class="trophy">🏆</div><h2>3rd Place</h2>`;
  third.forEach(r=>center.innerHTML+=card(r));

  const root=document.getElementById("bracket");
  root.innerHTML="";
  root.append(
    col("Round of 16",r16.slice(0,4)),
    Object.assign(document.createElement("div"),{className:"divider"}),
    col("Quarterfinals",qf.slice(0,2)),
    Object.assign(document.createElement("div"),{className:"divider"}),
    center,
    Object.assign(document.createElement("div"),{className:"divider"}),
    col("Quarterfinals",qf.slice(2)),
    Object.assign(document.createElement("div"),{className:"divider"}),
    col("Round of 16",r16.slice(4))
  );
}

render();
setInterval(render,20000);
</script>

</body>
</html>

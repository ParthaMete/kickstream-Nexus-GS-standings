<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perceptron 2026 — eFootball Knockouts</title>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --line:#38bdf8;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  margin:0;
  padding:50px;
  font-family:Poppins,system-ui,Arial;
  color:var(--text);

  background:
    radial-gradient(circle at top,#1e293b,#020617 70%),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 1px,
      transparent 8px
    );
}

/* HEADER */
h1{
  text-align:center;
  font-size:52px;
  margin-bottom:10px;
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  text-align:center;
  margin-bottom:40px;
  opacity:.7;
}

/* BRACKET WRAPPER */
.bracket-wrapper{
  position:relative;
}

/* SVG CONNECTOR LINES */
svg{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* GRID */
.bracket{
  position:relative;
  display:grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr 1.4fr;
  gap:80px;
  align-items:center;
}

/* COLUMNS */
.column{
  display:flex;
  flex-direction:column;
  gap:26px;
}

.column h2{
  text-align:center;
  color:#7dd3fc;
}

/* MATCH CARD */
.match{
  background:linear-gradient(180deg,#111827,#0b1224);
  border-radius:18px;
  padding:16px;
  text-align:center;
  box-shadow:0 20px 45px rgba(0,0,0,.6);
}

.player{padding:6px 0}
.score{font-size:22px;font-weight:800}
.win{color:var(--win)}

/* CENTER */
.center{
  align-items:center;
}
.trophy{
  font-size:110px;
  margin:20px 0;
  filter:drop-shadow(0 0 30px rgba(56,189,248,.9));
}
.champion{
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  color:#020617;
  padding:14px 36px;
  border-radius:999px;
  font-weight:800;
  margin-bottom:20px;
}

/* THIRD PLACE */
.third{
  margin-top:30px;
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="sub">🏆 Road to Glory</div>

<div class="bracket-wrapper">

<!-- CONNECTING LINES -->
<svg viewBox="0 0 1400 800" preserveAspectRatio="none">
  <!-- LEFT SIDE -->
  <path d="M250 140 H380 V260 H500" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M250 360 H380 V260" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <path d="M250 520 H380 V640 H500" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M250 740 H380 V640" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- RIGHT SIDE -->
  <path d="M1150 140 H1020 V260 H900" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M1150 360 H1020 V260" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <path d="M1150 520 H1020 V640 H900" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M1150 740 H1020 V640" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- SEMI TO FINAL -->
  <path d="M500 260 H700" stroke="#38bdf8" stroke-width="3"/>
  <path d="M900 260 H700" stroke="#38bdf8" stroke-width="3"/>
</svg>

<!-- BRACKET CONTENT -->
<div class="bracket" id="bracket"></div>

</div>

<script>
const SHEET_ID="1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  const t=await r.text();
  const j=JSON.parse(t.substring(47).slice(0,-2));
  return j.table.rows.map(x=>x.c.map(c=>c?.v ?? ""));
}

function card([,a,b,sa,sb]){
  let aw="",bw="";
  if(sa!==""&&sb!==""){
    if(sa>sb) aw="win";
    if(sb>sa) bw="win";
  }
  return `
  <div class="match">
    <div class="player ${aw}">${a}</div>
    <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
    <div class="player ${bw}">${b}</div>
  </div>`;
}

async function render(){
  const r16=await fetchSheet("Knockout");
  const qf =await fetchSheet("Quarterfinals");
  const fin=await fetchSheet("Final");
  const third=await fetchSheet("ThirdPlace");

  const col=(title,rows)=>{
    const d=document.createElement("div");
    d.className="column";
    d.innerHTML=`<h2>${title}</h2>`;
    rows.forEach(r=>d.innerHTML+=card(r));
    return d;
  };

  const center=document.createElement("div");
  center.className="column center";
  center.innerHTML="<h2>Final</h2>";
  fin.forEach(r=>center.innerHTML+=card(r));

  if(fin[0]&&fin[0][3]!==""&&fin[0][4]!==""){
    const w=fin[0][3]>fin[0][4]?fin[0][1]:fin[0][2];
    center.innerHTML=`<div class="champion">🏆 Champion: ${w}</div>`+center.innerHTML;
  }

  center.innerHTML+=`<div class="trophy">🏆</div>
    <div class="third"><h2>3rd Place</h2></div>`;
  third.forEach(r=>center.innerHTML+=card(r));

  const root=document.getElementById("bracket");
  root.innerHTML="";
  root.append(
    col("Round of 16",r16.slice(0,4)),
    col("Quarterfinals",qf.slice(0,2)),
    center,
    col("Quarterfinals",qf.slice(2)),
    col("Round of 16",r16.slice(4))
  );
}

render();
setInterval(render,20000);
</script>

</body>
</html>

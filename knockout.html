<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perceptron 2026 — eFootball Knockouts</title>

<style>
:root{
  --bg:#020617;
  --panel:#0b1226;
  --divider:#38bdf8;
  --accent:#7dd3fc;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  margin:0;
  padding:70px;
  font-family:Poppins,system-ui,Arial;
  color:var(--text);

  background:
    radial-gradient(circle at center, rgba(56,189,248,.25), transparent 55%),
    radial-gradient(circle at bottom, rgba(0,0,0,.95), transparent 60%),
    linear-gradient(#020617,#020617);
}

/* TITLE */
h1{
  text-align:center;
  font-size:56px;
  margin-bottom:8px;
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  text-align:center;
  opacity:.75;
  margin-bottom:70px;
}

/* MAIN GRID */
.bracket{
  display:grid;
  grid-template-columns: 1.4fr .08fr 1fr .08fr 1fr .08fr 1fr .08fr 1.4fr;
  align-items:center;
}

/* VERTICAL DIVIDER */
.divider{
  height:100%;
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(56,189,248,.5),
    transparent
  );
  border-radius:10px;
  box-shadow:0 0 25px rgba(56,189,248,.6);
}

/* COLUMN */
.column{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.column h2{
  text-align:center;
  color:var(--accent);
  margin-bottom:10px;
}

/* MATCH CARD */
.match{
  background:linear-gradient(180deg,#0f172a,#020617);
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:
    0 25px 60px rgba(0,0,0,.9),
    inset 0 0 0 1px rgba(255,255,255,.04);
}

.player{padding:6px 0}
.score{
  font-size:24px;
  font-weight:900;
  margin:6px 0;
}
.win{color:var(--win)}

/* CENTER COLUMN */
.center{
  align-items:center;
}

.trophy{
  font-size:140px;
  margin:30px 0;
  filter:drop-shadow(0 0 50px rgba(56,189,248,1));
}

.champion{
  background:linear-gradient(90deg,#38bdf8,#60a5fa);
  color:#020617;
  padding:16px 44px;
  border-radius:999px;
  font-size:22px;
  font-weight:900;
  margin-bottom:22px;
  box-shadow:0 0 35px rgba(56,189,248,.9);
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="sub">🏆 Road to Glory</div>

<div class="bracket" id="bracket"></div>

<script>
const SHEET_ID="1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  const t=await r.text();
  const j=JSON.parse(t.substring(47).slice(0,-2));
  return j.table.rows.map(x=>x.c.map(c=>c?.v ?? ""));
}

function card([,a,b,sa,sb]){
  let aw="",bw="";
  if(sa!==""&&sb!==""){
    if(sa>sb) aw="win";
    if(sb>sa) bw="win";
  }
  return `
    <div class="match">
      <div class="player ${aw}">${a}</div>
      <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
      <div class="player ${bw}">${b}</div>
    </div>`;
}

async function render(){
  const r16=await fetchSheet("Knockout");
  const qf =await fetchSheet("Quarterfinals");
  const fin=await fetchSheet("Final");
  const third=await fetchSheet("ThirdPlace");

  const col=(title,rows)=>{
    const d=document.createElement("div");
    d.className="column";
    d.innerHTML=`<h2>${title}</h2>`;
    rows.forEach(r=>d.innerHTML+=card(r));
    return d;
  };

  const center=document.createElement("div");
  center.className="column center";
  center.innerHTML="<h2>Final</h2>";
  fin.forEach(r=>center.innerHTML+=card(r));

  if(fin[0]&&fin[0][3]!==""&&fin[0][4]!==""){
    const w=fin[0][3]>fin[0][4]?fin[0][1]:fin[0][2];
    center.innerHTML=`<div class="champion">🏆 Champion: ${w}</div>`+center.innerHTML;
  }

  center.innerHTML+=`<div class="trophy">🏆</div>
    <h2>3rd Place</h2>`;
  third.forEach(r=>center.innerHTML+=card(r));

  const root=document.getElementById("bracket");
  root.innerHTML="";
  root.append(
    col("Round of 16",r16.slice(0,4)),
    document.createElement("div"),
    col("Quarterfinals",qf.slice(0,2)),
    document.createElement("div"),
    center,
    document.createElement("div"),
    col("Quarterfinals",qf.slice(2)),
    document.createElement("div"),
    col("Round of 16",r16.slice(4))
  );

  root.querySelectorAll("div:nth-child(2n)").forEach(d=>d.className="divider");
}

render();
setInterval(render,20000);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>eFootball Knockout Stage</title>

<style>
:root{
  --accent:#22d3ee;
  --win:#4ade80;
  --text:#e5e7eb;
}

body{
  background:
    radial-gradient(circle at top,#1e293b,#020617 60%),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 2px,
      transparent 2px,
      transparent 6px
    );
  color:var(--text);
  font-family:Poppins,system-ui,Arial;
  padding:40px;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:10px;
  background:linear-gradient(90deg,#22d3ee,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:30px;
}

a{
  color:#7dd3fc;
  text-decoration:none;
}

/* BRACKET GRID */
.bracket{
  display:grid;
  grid-template-columns: 1.3fr 1fr 1.4fr 1fr 1.3fr;
  gap:32px;
  align-items:center;
}

/* COLUMNS */
.column{
  display:flex;
  flex-direction:column;
  gap:18px;
  background:rgba(15,23,42,.65);
  backdrop-filter: blur(12px);
  border-radius:22px;
  padding:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.5);
  position:relative;
}

.column::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(34,211,238,.12),transparent);
  pointer-events:none;
}

.column.center{
  align-items:center;
}

/* TITLES */
.column h2{
  text-align:center;
  margin-bottom:6px;
  color:#7dd3fc;
  letter-spacing:1px;
}

/* MATCH CARD */
.match{
  background:rgba(255,255,255,.06);
  border-radius:16px;
  padding:14px;
  text-align:center;
  transition:.35s;
  position:relative;
}

.match.locked{
  opacity:.4;
  filter:grayscale(1);
}

.match:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 15px 30px rgba(0,0,0,.45);
}

.player{
  padding:6px 0;
  font-size:15px;
}

.score{
  font-size:22px;
  font-weight:700;
  margin:6px 0;
}

.win{
  color:var(--win);
  font-weight:700;
  text-shadow:0 0 14px rgba(74,222,128,.9);
}

/* CONNECTOR LINES */
.column:not(.center)::before{
  content:"";
  position:absolute;
  right:-16px;
  top:20%;
  bottom:20%;
  width:4px;
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(34,211,238,.6),
    transparent
  );
  opacity:.5;
}

.column:nth-child(4)::before,
.column:nth-child(5)::before{
  left:-16px;
  right:auto;
}

/* TROPHY */
.trophy{
  font-size:100px;
  margin:18px 0;
  filter: drop-shadow(0 0 30px rgba(34,211,238,.9));
}

/* CHAMPION BANNER */
.champion{
  background:linear-gradient(90deg,#22d3ee,#60a5fa);
  color:#020617;
  font-size:22px;
  font-weight:800;
  padding:14px 28px;
  border-radius:999px;
  margin-bottom:18px;
  animation:champGlow 2.5s infinite;
}

@keyframes champGlow{
  0%{box-shadow:0 0 15px rgba(34,211,238,.4);}
  50%{box-shadow:0 0 35px rgba(34,211,238,1);}
  100%{box-shadow:0 0 15px rgba(34,211,238,.4);}
}

/* BIG SCREEN */
@media (min-width:1600px){
  body{padding:60px;}
  h1{font-size:52px;}
}
</style>
</head>

<body>

<h1>Perceptron 2026 — eFootball Knockouts</h1>
<div class="subtitle">
  <a href="index.html">← Back to Group Stage</a>
</div>

<div id="bracket" class="bracket"></div>

<script>
const SHEET_ID = "1lblizIobMy975uF3IV38rCqk3E98d6jRcmjQVpXHtqI";

async function fetchSheet(sheet){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(47).slice(0,-2));
  return json.table.rows.map(r => r.c.map(c => c?.v ?? ""));
}

function matchCard([,a,b,sa,sb]){
  let aWin="", bWin="", locked="locked";
  if(sa!=="" && sb!==""){
    locked="";
    if(sa>sb) aWin="win";
    if(sb>sa) bWin="win";
  }

  return `
    <div class="match ${locked}">
      <div class="player ${aWin}">${a}</div>
      <div class="score">${sa ?? ""} – ${sb ?? ""}</div>
      <div class="player ${bWin}">${b}</div>
    </div>
  `;
}

async function render(){
  const root = document.getElementById("bracket");
  root.innerHTML = "";

  const r16 = await fetchSheet("Knockout");
  const qf  = await fetchSheet("Quarterfinals");
  const sf  = await fetchSheet("Semifinals");
  const fin = await fetchSheet("Final");
  const third = await fetchSheet("ThirdPlace");

  const col = (title, rows, center=false) => {
    const d = document.createElement("div");
    d.className = center ? "column center" : "column";
    d.innerHTML = `<h2>${title}</h2>`;
    rows.forEach(r => d.innerHTML += matchCard(r));
    return d;
  };

  const center = document.createElement("div");
  center.className="column center";
  center.innerHTML=`<h2>Final</h2>`;

  fin.forEach(r => center.innerHTML += matchCard(r));

  if(fin[0] && fin[0][3]!=="" && fin[0][4]!==""){
    const winner = fin[0][3] > fin[0][4] ? fin[0][1] : fin[0][2];
    center.innerHTML =
      `<div class="champion">🏆 Champion: ${winner}</div>` +
      center.innerHTML;
  }

  center.innerHTML += `<div class="trophy">🏆</div>`;
  center.innerHTML += `<h2>3rd Place Match</h2>`;
  third.forEach(r => center.innerHTML += matchCard(r));

  root.append(
    col("Round of 16", r16.slice(0,4)),
    col("Quarterfinals", qf.slice(0,2)),
    center,
    col("Quarterfinals", qf.slice(2)),
    col("Round of 16", r16.slice(4))
  );
}

render();
setInterval(render, 20000);
</script>

</body>
</html>
